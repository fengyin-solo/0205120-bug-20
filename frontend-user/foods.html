<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美食 - 贵州红色旅游</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="header">
    <div class="container header-inner">
        <a href="index.html" class="logo"><i class="fas fa-flag"></i> <span>贵州红色旅游</span></a>
        <nav class="nav">
            <a href="index.html" data-i18n="home">首页</a>
            <a href="spots.html" data-i18n="spots">景点</a>
            <a href="routes.html" data-i18n="routes">线路</a>
            <a href="culture.html" data-i18n="culture">红色文化</a>
            <a href="hotels.html" data-i18n="hotels">酒店</a>
            <a href="foods.html" class="active" data-i18n="foods">美食</a>
            <a href="faq.html" data-i18n="faq">客服</a>
        </nav>
        <div class="header-right">
            <div class="lang-switcher"><select id="langSelect" onchange="switchLang(this.value)"><option value="zh">中文</option><option value="en">English</option><option value="ja">日本語</option></select></div>
            <div id="userMenu"></div>
        </div>
    </div>
</header>

<div class="container">
    <div class="section">
        <div class="section-title"><span>美食列表</span></div>
        <div class="filter-bar">
            <select id="category" onchange="loadFoods(1)">
                <option value="">全部分类</option>
            </select>
            <input type="text" id="keyword" placeholder="搜索美食..." onkeyup="if(event.key==='Enter')loadFoods(1)">
            <select id="orderBy" onchange="loadFoods(1)">
                <option value="">默认排序</option>
                <option value="price">价格排序</option>
                <option value="rating">评分排序</option>
            </select>
            <button class="btn btn-primary btn-sm" onclick="loadFoods(1)"><i class="fas fa-search"></i> 搜索</button>
        </div>
        <div class="card-grid" id="foodList"></div>
        <div class="pagination" id="pagination"></div>
    </div>
</div>

<footer class="footer"><div class="container"><p>© 2026 贵州红色文化旅游景点信息管理系统</p></div></footer>

<script src="js/common.js"></script>
<script>
let currentPage = 1, totalRecords = 0;

async function loadCategories() {
    const data = await api('/api/food/categories');
    if (!data) return;
    const sel = document.getElementById('category');
    (Array.isArray(data) ? data : []).forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.name || c;
        opt.textContent = c.name || c;
        sel.appendChild(opt);
    });
}

async function loadFoods(page) {
    currentPage = page;
    const category = document.getElementById('category').value;
    const keyword = document.getElementById('keyword').value.trim();
    const orderBy = document.getElementById('orderBy').value;
    const data = await api('/api/food/list?page=' + page + '&size=9&category=' + encodeURIComponent(category) + '&keyword=' + encodeURIComponent(keyword) + '&orderBy=' + orderBy);
    const el = document.getElementById('foodList');
    if (!data) { el.innerHTML = '<div class="empty"><i class="fas fa-utensils"></i><p>暂无数据</p></div>'; return; }
    const list = data.records || data.list || data;
    totalRecords = data.total || list.length;
    if (!list.length) { el.innerHTML = '<div class="empty"><i class="fas fa-utensils"></i><p>暂无数据</p></div>'; document.getElementById('pagination').innerHTML = ''; return; }
    el.innerHTML = list.map(f =>
        '<a class="card" href="food-detail.html?id=' + f.id + '">' +
            '<div class="card-img">' +
                '<img src="' + API + (f.coverImage || '') + '" onerror="imgError(this)" alt="">' +
                (f.category ? '<span class="card-tag">' + f.category + '</span>' : '') +
            '</div>' +
            '<div class="card-body">' +
                '<h3>' + (f.name || '') + '</h3>' +
                '<p>' + (f.description || f.intro || '') + '</p>' +
                '<div class="card-meta">' +
                    '<span class="card-price">¥' + (f.price || 0) + '</span>' +
                    '<span class="card-rating">' + renderStars(Math.round(f.avgRating || 0)) + ' <span style="color:var(--text3);font-size:12px">' + (Number(f.avgRating) || 0).toFixed(1) + '分 · ' + (f.commentCount || 0) + '条</span></span>' +
                '</div>' +
            '</div>' +
        '</a>'
    ).join('');
    renderPagination(document.getElementById('pagination'), currentPage, totalRecords, 9, 'loadFoods');
}

loadCategories();
loadFoods(1);
</script>
</body>
</html>
