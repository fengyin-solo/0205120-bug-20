<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>酒店 - 贵州红色旅游</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="header">
    <div class="container header-inner">
        <a href="index.html" class="logo"><i class="fas fa-flag"></i> <span>贵州红色旅游</span></a>
        <nav class="nav">
            <a href="index.html" data-i18n="home">首页</a>
            <a href="spots.html" data-i18n="spots">景点</a>
            <a href="routes.html" data-i18n="routes">线路</a>
            <a href="culture.html" data-i18n="culture">红色文化</a>
            <a href="hotels.html" class="active" data-i18n="hotels">酒店</a>
            <a href="foods.html" data-i18n="foods">美食</a>
            <a href="faq.html" data-i18n="faq">客服</a>
        </nav>
        <div class="header-right">
            <div class="lang-switcher"><select id="langSelect" onchange="switchLang(this.value)"><option value="zh">中文</option><option value="en">English</option><option value="ja">日本語</option></select></div>
            <div id="userMenu"></div>
        </div>
    </div>
</header>

<div class="container">
    <div class="section">
        <div class="section-title"><span>酒店列表</span></div>
        <div class="filter-bar">
            <input type="text" id="keyword" placeholder="搜索酒店名称..." onkeyup="if(event.key==='Enter')loadHotels(1)">
            <select id="orderBy" onchange="loadHotels(1)">
                <option value="">默认排序</option>
                <option value="price">价格排序</option>
                <option value="rating">评分排序</option>
            </select>
            <button class="btn btn-primary btn-sm" onclick="loadHotels(1)"><i class="fas fa-search"></i> 搜索</button>
        </div>
        <div class="card-grid" id="hotelList"></div>
        <div class="pagination" id="pagination"></div>
    </div>
</div>

<footer class="footer"><div class="container"><p>© 2026 贵州红色文化旅游景点信息管理系统</p></div></footer>

<script src="js/common.js"></script>
<script>
let currentPage = 1, totalRecords = 0;

async function loadHotels(page) {
    currentPage = page;
    const keyword = document.getElementById('keyword').value.trim();
    const orderBy = document.getElementById('orderBy').value;
    const data = await api('/api/hotel/list?page=' + page + '&size=9&keyword=' + encodeURIComponent(keyword) + '&orderBy=' + orderBy);
    const el = document.getElementById('hotelList');
    if (!data) { el.innerHTML = '<div class="empty"><i class="fas fa-hotel"></i><p>暂无数据</p></div>'; return; }
    const list = data.records || data.list || data;
    totalRecords = data.total || list.length;
    if (!list.length) { el.innerHTML = '<div class="empty"><i class="fas fa-hotel"></i><p>暂无数据</p></div>'; document.getElementById('pagination').innerHTML = ''; return; }
    el.innerHTML = list.map(h => {
        let tags = '';
        if (h.hasBreakfast || h.has_breakfast) tags += '<span class="tag tag-gold">含早餐</span>';
        if (h.hasRoomService || h.has_room_service) tags += '<span class="tag tag-red">客房服务</span>';
        return '<a class="card" href="hotel-detail.html?id=' + h.id + '">' +
            '<div class="card-img"><img src="' + API + (h.coverImage || '') + '" onerror="imgError(this)" alt=""></div>' +
            '<div class="card-body">' +
                '<h3>' + (h.name || '') + '</h3>' +
                '<p><i class="fas fa-map-marker-alt"></i> ' + (h.location || h.address || '') + '</p>' +
                '<div style="margin:6px 0">' + tags + '</div>' +
                '<div class="card-meta">' +
                    '<span class="card-price">¥' + (h.price || 0) + '<small>/晚</small></span>' +
                    '<span class="card-rating">' + renderStars(Math.round(h.rating || 0)) + ' <span style="color:var(--text3);font-size:12px">' + (Number(h.rating) || 0).toFixed(1) + '分 · ' + (h.commentCount || 0) + '条</span></span>' +
                '</div>' +
            '</div>' +
        '</a>';
    }).join('');
    renderPagination(document.getElementById('pagination'), currentPage, totalRecords, 9, 'loadHotels');
}

loadHotels(1);
</script>
</body>
</html>
